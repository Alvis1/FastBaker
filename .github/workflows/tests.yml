# FastBake test matrix.
#
# Plan §10 mitigation for "Blender 5.x API churn" (the #1 competitor
# complaint) and §11 M7's QA matrix: every supported Blender release runs the
# headless integration suite, so the 4.5 branch of every compat.py seam is
# executed by CI instead of only the one Blender a developer happens to have
# installed.
#
# Blender versions = the supported set from plan §9 (4.5 LTS, 5.0, 5.1, 5.2),
# each pinned to its newest patch release. Every tarball URL below was
# verified to return HTTP 200 on download.blender.org before being committed;
# when a patch release is superseded the old file stays available, so these
# stay valid — bump them deliberately.
#
# Heavier suites (tests/bl_torture.py, tests/bl_uv_bench.py,
# tests/bl_guard_presets.py) are run on demand, not here: they take minutes
# per Blender version. See README "Tests".

name: tests

on:
  push:
  workflow_dispatch:

jobs:
  naming:
    name: naming unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pure-Python, no bpy: runs in seconds and fails fast on a naming
      # regression before any Blender is downloaded.
      - run: python3 tests/test_naming.py

  blender:
    name: bl_smoke (Blender ${{ matrix.blender }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4.5 LTS — FastBake's floor (blender_version_min), Python 3.11
          - blender: "4.5.14"
            url: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          # 5.0 — compositing_node_group / media_type / FAST->FLOAT churn
          - blender: "5.0.1"
            url: https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz
          # 5.1 — first Python 3.13 release (the cp312-abi3 wheel leg)
          - blender: "5.1.2"
            url: https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          # 5.2 LTS — newest supported
          - blender: "5.2.2"
            url: https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v4

      # Blender needs these even in --background: the binary links against
      # X11/GL at load time regardless of whether a window is opened.
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libsm6 libice6 libgl1 libegl1 libglu1-mesa

      - name: Cache Blender ${{ matrix.blender }}
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender ${{ matrix.blender }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o blender.tar.xz "${{ matrix.url }}"
          mkdir -p blender
          # the tarball has a single blender-<ver>-linux-x64/ top directory
          tar -xJf blender.tar.xz -C blender --strip-components=1
          rm blender.tar.xz

      - name: Version banner
        run: ./blender/blender --version

      - name: Headless integration suite
        run: |
          set -euo pipefail
          # --python-exit-code 1: without it Blender exits 0 even when the
          # script dies with an uncaught exception.
          ./blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/bl_smoke.py

      - name: Source alpha and outer-shell suites
        run: |
          set -euo pipefail
          ./blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/bl_alpha.py
          ./blender/blender --background --factory-startup \
            --python-exit-code 1 --python tests/bl_outer_shell.py
